[project]
name = "klyprima"
version = "0.3.0"
description = "Klyprima - social video downloader and AI Reframe (landscape to portrait) tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "numpy>=2.3",
    "opencv-contrib-python-headless>=5.0",   # YuNet faces, DB text detector, CSRT tracker
    "onnxruntime>=1.22",                     # YOLOX objects + Silero speech detection
    "faster-whisper>=1.2.1",
    "anthropic>=2.13",
]

[tool.uv]
# Keep EVERYTHING on D: (C: drive is low on space).
cache-dir = "../.uv-cache"
python-preference = "only-system"   # reuse the installed Python, never download one
link-mode = "copy"
package = false

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=../.tmp/pytest"
filterwarnings = ["ignore::DeprecationWarning"]
